document.getElementById("inup").onclick = function(){
  let inp = document.createElement("input");
  inp.type = "file";
  inp.addEventListener('change', function(e){
    let reader = new FileReader();
    reader.onload = async function(){
      let txt = reader.result;
      document.getElementById("inta").value = txt;
    }
    reader.readAsText(e.target.files[0]);    
    document.body.removeChild(inp);
  }, false);
  document.body.appendChild(inp);
  inp.style.display="none"
  inp.click();
}

function get_bbox(points){
  let xmin = Infinity;
  let ymin = Infinity;
  let xmax = -Infinity;
  let ymax = -Infinity
  for (let i = 0;i < points.length; i++){
    let [x,y] = points[i];
    xmin = Math.min(xmin,x);
    ymin = Math.min(ymin,y);
    xmax = Math.max(xmax,x);
    ymax = Math.max(ymax,y);
  }
  return {x:xmin,y:ymin,w:xmax-xmin,h:ymax-ymin};
}

      ${polylines[i][0][0]}

      "/>`;

  }
  o += `</svg>`
  return o;
}


function toolpath(){
  let lines = VECEDIT.polys;
  let out = [['Z',150]];
  let lx = 0;
  let ly = 0;
  for (let i = 0; i < lines.length; i++){
    for (let j = 0; j < lines[i].length; j++){
      let x = ~~lines[i][j][0];
      let y = ~~lines[i][j][1];
      let dx = x-lx;
      let dy = y-ly;
      if (dx != 0 || dy != 0){
        if (out.at(-1) && out.at(-1)[0] == 'l' && Math.sign(out.at(-1)[1])==Math.sign(dx) && out.at(-1)[1]/out.at(-1)[3]== dx/dy){
          out.at(-1)[1]+=dx;
          out.at(-1)[3]+=dy;
        }else{
          out.push(['l',dx,',',dy]);
        }
      }
      if (j == 0){
        out.push(['Z',90]);
      }
      lx = x;
      ly = y;
    }
    out.push(['Z',150]);
  }
  out.push(['Z',150]);
  out.push(['l',-lx,',',-ly]);
  for (let i = 0; i < out.length; i++){
    if (out[i][0]=='l'){
      let x = out[i][1];
      let y = out[i][3];
      if (Math.abs(x) + Math.abs(y) > 1000){
        let hx = ~~(x/2);
        let hy = ~~(y/2);
        out[i][1]=hx;
        out[i][3]=hy;
        out.splice(i+1,0,['l',x-hx,',',y-hy]);
        i--;
      }
    }
  }
  return out.map(x=>x.join('')).join("\n")
}

function letter(c,x0,y0){
  let offs = HF_OFFS[c.charCodeAt(0)];
  let n = HF_DATA[offs]*2;
  let w = HF_DATA[offs+1];
  let isup = 1;
  let out = [];

  for (let i = 0; i < n; i+=2){
    let x = HF_DATA[offs+2+i];
    let y = HF_DATA[offs+2+i+1];
    if (x == ' '.charCodeAt(0) && y == 'R'.charCodeAt(0)){
      out.push([])
    }else{
      if (!out.length) out.push([]);
      x-='R'.charCodeAt(0);
      y-='R'.charCodeAt(0);
      out.at(-1).push([x0+x,y0+y]);
    }
  }
  return [out,w];
}

function paragraphs(cs){
  let x0 = 0;
  let y0 = 0;
  let out = [];
  cs = cs.replace(/\r/g,"\n");
  for (let i = 0; i < cs.length; i++){
    let c = cs[i];
    if (c == '\n'){
      y0 += 32;
      x0 = 0;
    }else if (c == ' '){
      x0 += 8;
    }else{
      let [o,w] = letter(c,x0,y0);
      out = out.concat(o);
      x0 += w;
    }
  }
  return out;
}

function approxPolyDP(polyline, epsilon){
  function pointDistanceToSegment(p, p0, p1) {
    let x = p[0];   let y = p[1];
    let x1 = p0[0]; let y1 = p0[1];
    let x2 = p1[0]; let y2 = p1[1];
    let A = x - x1; let B = y - y1; let C = x2 - x1; let D = y2 - y1;
    let dot = A*C+B*D;
    let len_sq = C*C+D*D;
    let param = -1;
    if (len_sq != 0) {
      param = dot / len_sq;
    }
    let xx; let yy;
    if (param < 0) {
      xx = x1; yy = y1;
    }else if (param > 1) {
      xx = x2; yy = y2;
    }else {
      xx = x1 + param*C;
      yy = y1 + param*D;
    }
    let dx = x - xx;
    let dy = y - yy;
    return Math.sqrt(dx*dx+dy*dy);
  }
  if (polyline.length <= 2){
    return polyline;
  }
  let dmax   = 0;
  let argmax = -1;
  for (let i = 1; i < polyline.length-1; i++){
    let d = pointDistanceToSegment(polyline[i], 
                                    polyline[0], 
                                    polyline[polyline.length-1]);
    if (d > dmax){
      dmax = d;
      argmax = i;
    }  
  }
  let ret = [];
  if (dmax > epsilon){
    let L = approxPolyDP(polyline.slice(0,argmax+1),epsilon);
    let R = approxPolyDP(polyline.slice(argmax,polyline.length),epsilon);
    ret = ret.concat(L.slice(0,L.length-1)).concat(R);
  }else{
    ret.push(polyline[0].slice());
    ret.push(polyline[polyline.length-1].slice());
  }
  return ret;
}

function millis_to_str(t){
  let sec = Math.round(t / 1000);
  let min = ~~(sec / 60);
  sec -= min*60;
  let hr = ~~(min / 60);
  min -= hr*60;
  return `${hr}hr ${min}min ${sec}sec`;
}


function connector(params, connect, disconnect, send){
  function estimate_time(cmds){
    cmds = cmds.split("\n").map(x=>x.trim()).filter(x=>x.length);
    let t = 0;
    for (let i = 0; i < cmds.length; i++){
      let s = cmds[i];
      if (s.startsWith('l')){
        let xy = JSON.parse('['+s.slice(1)+']');
        t += (Math.abs(xy[0])+Math.abs(xy[1]))*17;
      }else if (s.startsWith('Z')){
        let z = Number(s.slice(1));
        t += 500;
      }
      t += params.baud ? ((s.length+4) * 10 / Number(params.baud) + 1) : 10;
    }
    return t;
  }
  return new function(){
    let that = this;
    
    let div = document.createElement("div");
    div.innerHTML = `
    <div style="position:absolute;width:100%;height:100%;overflow:scroll">
    <div style="position:absolute;left:2px;width:calc(100% - 150px);height:100%">
    ${Object.keys(params).map(x=>`<div style="height:20px;text-align:right;font-size:11px">${x}:<input id="tr_${x}" style="font-size:11px;width:calc(100% - 150px)" value="${params[x]}"></input></div>`).join('')}
    
    <textarea id="tb_ta" style="width:100%;height:calc(100% - ${Object.keys(params).length*20+140}px);min-height:50px"></textarea>
    <div id="tb_stat"></div>
    <div id="tb_time"></div>
    
    </div>
    <div style="position:absolute;right:10px;top:0px;">
      <button id="tb_c" style="width:130px">connect</button><br>
      <button id="tb_dc" style="width:130px">disconnect</button><br>
      <button id="tb_xm" style="width:65px">X-10</button><button id="tb_xp" style="width:65px">X+10</button><br>
      <button id="tb_ym" style="width:65px">Y-10</button><button id="tb_yp" style="width:65px">Y+10</button><br>
      <button id="tb_xmm" style="width:65px">X-100</button><button id="tb_xpp" style="width:65px">X+100</button><br>
      <button id="tb_ymm" style="width:65px">Y-100</button><button id="tb_ypp" style="width:65px">Y+100</button><br>
      <button id="tb_zmm" style="width:65px">Z up</button><button id="tb_zpp" style="width:65px">Z down</button><br>
      <button id="tb_s" style="width:130px">send</button><br>
      <button id="tb_x" style="width:130px">stop</button><br>
      <input id="tb_p" type="checkbox"></input>pause<br>
    </div>
    </div>
    `;
    for (let k in params){
      div.querySelector(`#tr_${k}`).onchange = function(){
        params[k] = div.querySelector(`#tr_${k}`).value;
      }
    }
    let tot_t = 0;
    let cur_t = 0;
    let wal_t = 0;
    async function wsend(i,n,s){
      if (s.startsWith('l')){
        let xy = JSON.parse('['+s.slice(1)+']');
        let ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("x1", SIMU.x);
        ln.setAttribute("y1", SIMU.y);
        ln.setAttribute("x2", SIMU.x+xy[0]);
        ln.setAttribute("y2", SIMU.y+xy[1]);
        ln.setAttribute("stroke","dodgerblue");
        ln.setAttribute("stroke-width", (SIMU.state == 0 || SIMU.state == 150)?2:4);
        document.getElementById("svg-preview").appendChild(ln);
        SIMU.x += xy[0];
        SIMU.y += xy[1];
      }else if (s.startsWith('Z')){
        SIMU.state = Number(s.slice(1));
      }
      div.querySelector("#tb_stat").innerHTML = `[${i}/${n}] sending '${s}' ...`;
      await send(s);
      div.querySelector("#tb_stat").innerHTML = `[${i}/${n}] sent.`;
    }
    
    div.querySelector("#tb_c").onclick = async function(){
      await connect(params);
    };
    div.querySelector("#tb_dc").onclick = async function(){
      await disconnect(params);
    };
    div.querySelector("#tb_ta").onchange = function(){
      tot_t = estimate_time(div.querySelector("#tb_ta").value);
      console.log(tot_t,'millis')
      div.querySelector("#tb_time").innerHTML = "estimated total time: "+millis_to_str(tot_t);

    }
    let abort = 0;
    div.querySelector("#tb_s").onclick = async function(){
      abort = 0;
      cur_t = 0;
      wal_t = new Date().getTime();
      let lines = div.querySelector("#tb_ta").value.split('\n').map(x=>x.trim()).filter(x=>x.length);
      for (let i = 0; i < lines.length; i++){
        if (abort) break;
        while ( div.querySelector("#tb_p").checked){
          await new Promise(resolve => setTimeout(resolve, 100)); 
        }
        await wsend(i+1,lines.length,lines[i]);

        cur_t += estimate_time(lines[i]);
        let rel_t = new Date().getTime()-wal_t;
        let rem_t = tot_t-cur_t;
        let cor_t = rem_t * rel_t / cur_t;
        div.querySelector("#tb_time").innerHTML = `<table style="font-size:13px">
          <tr><td>estimated total time:</td><td>${millis_to_str(tot_t)}</td></tr>
          <tr><td>estimated elapsed time:</td><td>${millis_to_str(cur_t)}</td></tr>
          <tr><td>elapsed wall time:</td><td>${millis_to_str(rel_t)}</td></tr>
          <tr><td>estimated remaining time:</td><td>${millis_to_str(rem_t)}</td></tr>
          <tr><td>wall-corrected estimated remaining time:</td><td>${millis_to_str(cor_t)}</td></tr>
          </table>
        `;

      }
      div.querySelector("#tb_stat").innerHTML = `done.`;
    };
    div.querySelector("#tb_x").onclick = function(){
      abort = 1;
    };
    
    div.querySelector("#tb_xm" ).onclick = function(){wsend(1,1,"l-10,0")};
    div.querySelector("#tb_xp" ).onclick = function(){wsend(1,1,"l10,0")};
    div.querySelector("#tb_ym" ).onclick = function(){wsend(1,1,"l0,-10")};
    div.querySelector("#tb_yp" ).onclick = function(){wsend(1,1,"l0,10")};
    div.querySelector("#tb_xmm").onclick = function(){wsend(1,1,"l-100,0")};
    div.querySelector("#tb_xpp").onclick = function(){wsend(1,1,"l100,0")};
    div.querySelector("#tb_ymm").onclick = function(){wsend(1,1,"l0,-100")};
    div.querySelector("#tb_ypp").onclick = function(){wsend(1,1,"l0,100")};
    div.querySelector("#tb_zmm").onclick = function(){wsend(1,1,"Z150")};
    div.querySelector("#tb_zpp").onclick = function(){wsend(1,1,"Z90")};
    
    that.div = div;
  }
}

let mon = {};

let SERTRAN = connector(
  {baud:115200},
  async function(params){
    if (navigator.serial){
      window.serial = navigator.serial;
    }
    if (!window.serial){
      console.log("your browser/protocol does not support WebSerial; try chrome/https.");
    }
    let port = await window.serial.requestPort({});
    try{
      await port.open({baudRate: Number(params.baud)});
      console.log('port opened: '+JSON.stringify(port.getInfo()));
    }catch(e){
      console.log('port failed to open: '+e.toString());
      return;
    }
    mon.port = port;
    mon.reader = port.readable.getReader();
    mon.writer = port.writable.getWriter();
    mon.buf = [];
    mon.close = async function(x){
      mon.reader.releaseLock();
      mon.writer.releaseLock();
      mon.port.close();
      mon.port = null;
      console.log('port closed.');
    }
    if (mon.port){
      mon.port.ondisconnect = function(){
        console.log('connection lost.')
        mon.port = null;
      }
    }
  },
  async function(params){
    mon.close();
  },
  async function(s){
    if (!mon.writer) {console.log("not connected!"); return}
    const encoder = new TextEncoder();
    const view = encoder.encode(s+'\n');
    await mon.writer.write(view);
    
    let o = "";
    async function loop(){
      let {value,done} = (await mon.reader.read());
      for (let i = 0; i < value.length; i++){
        o += String.fromCharCode(value[i]);
      }
      
      if (!o.includes('OK\n')){
        await loop();
      }
    }
    await loop();
    console.log(o);
  }                       
);
